apiVersion: 100monkeys.ai/v1
kind: AgentManifest

metadata:
  name: "web-researcher"
  version: "1.0.0"
  description: "Web research agent with browser automation and search capabilities"
  labels:
    role: "worker"
    category: "research"

spec:
  runtime:
    language: "python"
    version: "3.11"
    entrypoint: "main.py"
    isolation: "inherit"
  
  execution:
    memory: true  # Enable Cortex memory
  
  security:
    network:
      mode: "allow"
      allowlist:
        - "api.openai.com"
        - "*.google.com"
        - "*.wikipedia.org"
        - "arxiv.org"
    
    filesystem:
      read:
        - "/data/inputs"
      write:
        - "/data/outputs"
    
    resources:
      cpu: 1000       # 1000 millicores = 1.0 CPU core
      memory: "1Gi"
      disk: "2Gi"
      timeout: "600s" # 10 minutes for research
  
  tools:
    - "mcp:browser"
    - "mcp:search"
  
  env:
    OPENAI_API_KEY: "secret:openai-key"
