# AEGIS Agent Host - Minimal Configuration
#
# This is a minimal configuration to get started.
# Refer to https://docs.aegis.ai/docs/reference/node-config for the full specification.
# Refer to https://docs.aegis.ai/docs/deployment/configuration for an annotated walkthrough.

# Kubernetes-style manifest format (required)
apiVersion: 100monkeys.ai/v1
kind: NodeConfig

# Node identity and metadata
metadata:
  name: "my-aegis-node"
  version: "1.0.0"
  # labels:
  #   environment: "development"
  #   region: "us-west-2"

# Node configuration specification
spec:
  node:
    id: "change-me-to-unique-id"
    type: "edge"
    # region: "us-west-2"  # Optional
    # tags: ["development"]  # Optional

  # Caps `list_executions` results. Omitted values default to 1000.
  max_execution_list_limit: 1000

  builtin_dispatchers:
    - name: "cmd.run"
      enabled: true
      description: "Executes a shell command inside the agent's ephemeral container environment."
      capabilities:
        - name: "cmd.run"
    - name: "fs.read"
      enabled: true
      description: "Read the contents of a file at the given POSIX path."
      capabilities:
        - name: "fs.read"
          skip_judge: true   # read-only; no write-side risk — skip inner-loop judge overhead
    - name: "fs.write"
      enabled: true
      description: "Write content to a file at the given POSIX path."
      capabilities:
        - name: "fs.write"
    - name: "fs.list"
      enabled: true
      description: "List the contents of a directory."
      capabilities:
        - name: "fs.list"
          skip_judge: true   # read-only; no write-side risk — skip inner-loop judge overhead
    - name: "fs.create_dir"
      enabled: true
      description: "Creates a new directory along with any necessary parent directories."
      capabilities:
        - name: "fs.create_dir"
    - name: "fs.delete"
      enabled: true
      description: "Deletes a file or directory."
      capabilities:
        - name: "fs.delete"
    - name: "fs.edit"
      enabled: true
      description: "Performs an exact string replacement in a file."
      capabilities:
        - name: "fs.edit"
    - name: "fs.multi_edit"
      enabled: true
      description: "Performs multiple sequential string replacements in a file."
      capabilities:
        - name: "fs.multi_edit"
    - name: "fs.grep"
      enabled: true
      description: "Recursively searches for a regex pattern within files in a given directory."
      capabilities:
        - name: "fs.grep"
          skip_judge: true   # read-only — skip inner-loop judge overhead
    - name: "fs.glob"
      enabled: true
      description: "Recursively matches files against a glob pattern."
      capabilities:
        - name: "fs.glob"
          skip_judge: true   # read-only — skip inner-loop judge overhead
    - name: "web.search"
      enabled: true
      description: "Performs an internet search query."
      capabilities:
        - name: "web.search"
          skip_judge: true   # read-only external lookup — skip inner-loop judge overhead
    - name: "web.fetch"
      enabled: true
      description: "Fetches content from a URL, optionally converting HTML to Markdown."
      capabilities:
        - name: "web.fetch"
          skip_judge: true   # read-only external fetch — skip inner-loop judge overhead

  llm_providers:
    - name: "local"
      type: "ollama"
      endpoint: "http://ollama:11434"
      enabled: true
      models:
    #     - alias: "default"
    #       model: "phi3:mini"
    #       capabilities: ["code", "reasoning"]
    #       context_window: 4096
    #       cost_per_1k_tokens: 0.0
        - alias: "fast"
          model: "phi3:mini"
          capabilities: ["code"]
          context_window: 4096
          cost_per_1k_tokens: 0.0
    #     - alias: "smart"
    #       model: "phi3:mini"
    #       capabilities: ["code", "reasoning"]
    #       context_window: 4096
    #       cost_per_1k_tokens: 0.0
    #     - alias: "cheap"
    #       model: "qwen2.5-coder:7b"
    #       capabilities: ["code"]
    #       context_window: 4096
    #       cost_per_1k_tokens: 0.0
    #     - alias: "local"
    #       model: "phi3:mini"
    #       capabilities: ["code", "reasoning"]
    #       context_window: 4096
    #       cost_per_1k_tokens: 0.0
    - name: "anthropic"
      type: "anthropic"
      endpoint: "https://api.anthropic.com/v1"
      api_key: "env:ANTHROPIC_API_KEY"
      enabled: true
      models:
        # - alias: "default"
        #   model: "claude-haiku-4-5"
        #   capabilities: ["code", "reasoning"]
        #   context_window: 200000
        #   cost_per_1k_tokens: 0.0008
        - alias: "smart"
          model: "claude-sonnet-4-5"
          capabilities: ["code", "reasoning"]
          context_window: 200000
          cost_per_1k_tokens: 0.0008
        # - alias: "fast"
        #   model: "claude-haiku-4-5"
        #   capabilities: ["code"]
        #   context_window: 200000
        #   cost_per_1k_tokens: 0.0008
        # - alias: "cheap"
        #   model: "claude-haiku-4-5"
        #   capabilities: ["code"]
        #   context_window: 200000
        #   cost_per_1k_tokens: 0.0008
        - alias: "judge"
          model: "claude-sonnet-4-5"
          capabilities: ["code"]
          context_window: 200000
          cost_per_1k_tokens: 0.003
    - name: "lmstudio"
      type: "openai-compatible"
      endpoint: "http://10.10.0.117:1234/v1" # Replace 10.10.0.117 with your host/LMStudio IP address
      enabled: true
      models:
        - alias: "default"
          model: "google/gemma-3-4b"
          capabilities: ["code", "reasoning"]
          context_window: 8192
          cost_per_1k_tokens: 0.0
        - alias: "tool-call-judge"
          model: "google/gemma-3-4b"
          capabilities: ["code", "reasoning"]
          context_window: 8192
          cost_per_1k_tokens: 0.0
    #     - alias: "smart"
    #       model: "qwen/qwen3-vl-8b"
    #       capabilities: ["code", "reasoning"]
    #       context_window: 8192
    #       cost_per_1k_tokens: 0.0
    #     - alias: "fast"
    #       model: "google/gemma-3-4b"
    #       capabilities: ["code"]
    #       context_window: 8192
    #       cost_per_1k_tokens: 0.0
    #     - alias: "cheap"
    #       model: "google/gemma-3-4b"
    #       capabilities: ["code"]
    #       context_window: 8192
    #       cost_per_1k_tokens: 0.0

    # Uncomment to add an OpenAI provider:
    # - name: "openai"
    #   type: "openai"
    #   endpoint: "https://api.openai.com/v1"
    #   api_key: "env:OPENAI_API_KEY"
    #   enabled: true
    #   models:
    #     - alias: "smart"
    #       model: "gpt-4o"
    #       capabilities: ["code", "reasoning"]
    #       context_window: 128000
    #       cost_per_1k_tokens: 0.005
    #     - alias: "fast"
    #       model: "gpt-4o-mini"
    #       capabilities: ["code"]
    #       context_window: 128000
    #       cost_per_1k_tokens: 0.00015

  llm_selection:
    strategy: "prefer-cloud"
    default_provider: "anthropic"
    max_retries: 3
    retry_delay_ms: 1000

  runtime:
    # Default isolation mode for agent execution
    default_isolation: "docker"
    # Docker network for agent containers (only used when running in Docker)
    # Supports env:VAR_NAME syntax to read from environment variable
    docker_network_mode: "env:AEGIS_CONTAINER_NETWORK"
    # Orchestrator URL for agent bootstrap script callbacks (used inside containers)
    # Supports env:VAR_NAME syntax to read from environment variable
    orchestrator_url: "env:AEGIS_ORCHESTRATOR_URL"
    # NFS server hostname/IP for volume mounts
    # CRITICAL: Must be resolvable from the host OS where the Docker daemon runs, NOT the container network.
    #
    # Platform-specific values:
    #   - WSL2 / Linux Native: "127.0.0.1" (requires port 2049 exposed to host)
    #   - Docker Desktop (Windows/Mac): "host.docker.internal"
    #   - Linux Bridge Network: "172.17.0.1" (Docker bridge gateway IP)
    #   - Remote / VM host: <Physical Host IP>
    #
    # nfs_server_host: "env:AEGIS_NFS_HOST"  # Required for Docker deployments with volumes
    # nfs_port: 2049
    # nfs_mountport: 2049
    # Path to the StandardRuntime registry YAML.
    # Maps language+version to deterministic Docker images (e.g., python 3.11 → python:3.11-slim).
    # Default: "runtime-registry.yaml" (relative to daemon working directory)
    runtime_registry_path: "runtime-registry.yaml"

  # Deploy vendored built-in agent and workflow templates on startup.
  # Required for aegis.agent.generate and aegis.workflow.generate to function.
  # deploy_builtins: false

  # cortex:
  #   grpc_url: "http://aegis-cortex:50052"
  #   api_key: "env:CORTEX_API_KEY"   # omit for self-hosted

  storage:
    backend: "local_host"
    local_host:
      mount_point: "/tmp/aegis-volumes"

  network:
    # bind_address: "0.0.0.0"  # Optional (default: 0.0.0.0)
    # port: 8088               # Optional (default: 8088)
    # grpc_port: 50051         # Optional (default: 50051)

  observability:
    logging:
      level: "info"
      format: "json"

  # Secrets Management (OpenBao integration - ADR-034)
  secrets:
    openbao:
      address: "http://openbao:8200"
      auth_method: "approle"
      approle:
        role_id: "aegis-orchestrator-role"
        secret_id_env_var: "OPENBAO_SECRET_ID"
      # namespace: "aegis-system" # Uncomment if OpenBao namespaces are configured

  # PostgreSQL database for persistent state
  database:
    url: "env:AEGIS_DATABASE_URL"
    max_connections: 5
    connect_timeout_seconds: 5

  # Temporal workflow engine
  temporal:
    address: "temporal:7233"
    worker_http_endpoint: "http://temporal-worker:3000"
    worker_secret: "env:TEMPORAL_WORKER_SECRET"
    namespace: "default"
    task_queue: "aegis-agents"
    # Limits startup retries when connecting the Temporal client.
    max_connection_retries: 30

  # Keycloak IAM (ADR-041)
  # Defines trusted realms for JWT validation. The orchestrator validates Bearer
  # JWTs against JWKS endpoints of these realms. Omit this section entirely to
  # disable auth for local development without a running Keycloak instance.
  keycloak:
    realms:
      - slug: "aegis-system"
        issuer_url: "http://keycloak:8180/realms/aegis-system"
        jwks_uri: "http://keycloak:8180/realms/aegis-system/protocol/openid-connect/certs"
        audience: "aegis-orchestrator"
        kind: "system"
      - slug: "zaru-consumer"
        issuer_url: "http://keycloak:8180/realms/zaru-consumer"
        jwks_uri: "http://keycloak:8180/realms/zaru-consumer/protocol/openid-connect/certs"
        audience: "aegis-orchestrator"
        kind: "consumer"
    jwks_cache_ttl_seconds: 300
    claims:
      zaru_tier: "zaru_tier"
      aegis_role: "aegis_role"

  # gRPC authentication (ADR-041)
  # When enabled, all gRPC calls require a Keycloak Bearer JWT except exempted methods.
  # grpc_auth:
  #   enabled: true
  #   exempt_methods:
  #     - "/aegis.v1.InnerLoop/Generate"

  # Zaru tier security contexts (ADR-071 §ZaruTier SecurityContext Definitions)
  security_contexts:
    # Default unrestricted context for container agent executions (inner-loop)
    - name: "default"
      description: "Unrestricted context for orchestrator-managed agent executions."
      capabilities:
        - tool_pattern: "*"
      deny_list: []

    # ── Operator Context ──────────────────────────────────────────────
    # Platform operators only. Authenticated via aegis-system realm.
    # Superset of enterprise tier plus destructive and orchestrator commands.
    # Uses aegis-system- prefix (not zaru-) so SMCP middleware preserves
    # force/version parameters for operator tool invocations.
    - name: "aegis-system-operator"
      description: "Platform operator context. All safe, destructive, and orchestrator commands."
      capabilities:
        # Safe commands (shared with all consumer tiers)
        - tool_pattern: "web.search"
        - tool_pattern: "web.fetch"
        - tool_pattern: "aegis.schema.get"
        - tool_pattern: "aegis.schema.validate"
        - tool_pattern: "aegis.agent.create"
        - tool_pattern: "aegis.agent.list"
        - tool_pattern: "aegis.agent.export"
        - tool_pattern: "aegis.agent.generate"
        - tool_pattern: "aegis.agent.update"
        - tool_pattern: "aegis.agent.logs"
        - tool_pattern: "aegis.agent.wait"
        - tool_pattern: "aegis.workflow.create"
        - tool_pattern: "aegis.workflow.list"
        - tool_pattern: "aegis.workflow.export"
        - tool_pattern: "aegis.workflow.run"
        - tool_pattern: "aegis.workflow.generate"
        - tool_pattern: "aegis.workflow.update"
        - tool_pattern: "aegis.workflow.logs"
        - tool_pattern: "aegis.workflow.cancel"
        - tool_pattern: "aegis.workflow.wait"
        - tool_pattern: "aegis.workflow.signal"
        - tool_pattern: "aegis.task.execute"
        - tool_pattern: "aegis.task.status"
        - tool_pattern: "aegis.task.list"
        - tool_pattern: "aegis.task.wait"
        - tool_pattern: "aegis.task.cancel"
        - tool_pattern: "aegis.task.logs"
        - tool_pattern: "aegis.execute.intent"
        - tool_pattern: "aegis.execute.status"
        - tool_pattern: "aegis.tools.list"
        - tool_pattern: "aegis.tools.search"
        # Destructive commands (operator-only)
        - tool_pattern: "aegis.agent.delete"
        - tool_pattern: "aegis.workflow.delete"
        - tool_pattern: "aegis.task.remove"
        # Orchestrator commands (operator-only)
        - tool_pattern: "aegis.system.info"
        - tool_pattern: "aegis.system.config"
      deny_list: []
