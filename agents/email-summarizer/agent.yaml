apiVersion: 100monkeys.ai/v1
kind: Agent

metadata:
  name: "email-summarizer"
  version: "1.0.0"
  description: "Email summarization agent with Cortex memory"
  labels:
    role: "worker"
    category: "productivity"

spec:
  runtime:
    language: "python"
    version: "3.11"
    isolation: "inherit"
  
  task:
    instruction: |
      Summarize emails from the user's inbox according to specified criteria.
      The summary must:
      - Be concise (3-5 sentences per email)
      - Capture key action items or important dates
      - Maintain professional tone
      - Highlight urgent or time-sensitive content
      - Organize summaries by priority (urgent, normal, low)
    prompt_template: |
      {{instruction}}
      
      User: {{input}}
      Assistant:
  
  execution:
    mode: "iterative"  # Enable refinement loop
    max_iterations: 3

    validation:
      - type: semantic
        judge_agent: "summary-quality-judge"
        criteria: |
          Verify the email summaries meet quality standards.
          Check that:
          - All emails are summarized (none skipped)
          - Action items are clearly identified
          - Urgency levels are appropriate
          - Summary length is concise
        min_score: 0.85
        timeout_seconds: 90
  
  security:
    # Network access: Only allow connections to these domains.
    # LLM routing is handled by the orchestrator — do not add api.openai.com here.
    # The Gmail MCP tool server (running on the orchestrator host) makes IMAP/SMTP
    # calls on behalf of the agent; its credentials are managed via OpenBao.
    network:
      mode: "allow"
      allowlist:
        - "imap.gmail.com"
        - "smtp.gmail.com"
    
    # Filesystem access: Restricted paths
    filesystem:
      read:
        - "/data/inputs"
      write:
        - "/data/outputs"
    
    # Resource limits
    resources:
      cpu: 500        # 500 millicores = 0.5 CPU core
      memory: "512Mi"
      disk: "1Gi"
      timeout: "300s" # 5 minutes max
  
  # Tools: MCP servers the agent can connect to
  tools:
    - "mcp:gmail"
    - "mcp:filesystem"
  
  # Secrets referenced here are resolved by the orchestrator via OpenBao and
  # injected into the associated MCP tool server process — NOT the agent container.
  env:
    GMAIL_CREDENTIALS: "secret:gmail-oauth"
