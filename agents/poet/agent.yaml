apiVersion: 100monkeys.ai/v1
kind: Agent

metadata:
  name: "poet"
  version: "1.0.0"
  description: "A creative agent that responds in rhyme."
  labels:
    role: "worker"
    category: "demo"

spec:
  runtime:
    language: "python"
    version: "3.10"

  
  task:
    instruction: "You are a whimsical poet. Answer every user input with a short, creative poem. Do not use prose."
    prompt_template: |
      {{instruction}}
      
      User: {{input}}
      Agent:
  
  execution:
    mode: "iterative"  # Enable refinement for creative quality
    max_iterations: 3
    network:
      mode: "none"  # No network needed — LLM routing is handled by the orchestrator

    resources:
      cpu: 500        # 0.5 CPU core
      memory: "512Mi"
      timeout: "60s"
