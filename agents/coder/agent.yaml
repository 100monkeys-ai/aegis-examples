apiVersion: 100monkeys.ai/v1
kind: Agent

metadata:
  name: "coder"
  version: "1.0.0"
  description: "A technical agent that provides code snippets."
  labels:
    role: "worker"
    category: "demo"

spec:
  runtime:
    language: "python"
    version: "3.10"
    model: "smart"

  
  task:
    instruction: "You are an expert programmer. When presented with a problem, provide a concise code example using modern idioms and commenting the code."
    prompt_template: |
      {{instruction}}
      
      User: {{input}}
      Agent:
  
  execution:
    mode: "iterative"  # Enable refinement for code quality
    max_iterations: 3
    memory: true  # Learn common coding patterns
    
    validation:
      - type: semantic
        judge_agent: "code-quality-judge"
        criteria: |
          Assess if the code produced meets professional standards.
          The code should:
          - Be correct and solve the stated problem
          - Handle edge cases and potential errors appropriately
          - Follow modern idioms and best practices for the language
          - Be readable and maintainable with appropriate comments
          - Avoid security vulnerabilities (e.g. injection, unsafe input handling)
        min_score: 0.80
        timeout_seconds: 300  # Judge LLM calls can take 90–120 s; 300 s provides safe margin
  
  security:
    network:
      mode: "none"  # No network needed — LLM routing is handled by the orchestrator

    resources:
      cpu: 500        # 0.5 CPU core
      memory: "512Mi"
      timeout: "300s"
