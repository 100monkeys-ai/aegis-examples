apiVersion: 100monkeys.ai/v1
kind: Agent

metadata:
  name: "web-researcher"
  version: "1.0.0"
  description: "Web research agent with browser automation and search capabilities"
  labels:
    role: "worker"
    category: "research"

spec:
  type: user
  runtime:
    language: "python"
    version: "3.11"
    isolation: "inherit"
  
  task:
    instruction: |
      Research the given topic comprehensively using web search and browser automation.
      Produce a well-structured report with:
      - Executive summary (2-3 paragraphs)
      - Key findings with citations
      - Relevant statistics and data points
      - Credible sources from academic papers, official documentation, or reputable news outlets
      Ensure all claims are backed by verifiable sources.
    prompt_template: |
      {{instruction}}
      
      User: {{input}}
      Researcher:
  
  execution:
    mode: "iterative"  # Enable refinement loop
    max_iterations: 5

    validation:
      - type: semantic
        judge_agent: "research-quality-judge"
        criteria: |
          Evaluate if the research report meets these criteria:
          - Be well-structured and readable
          - Include verifiable citations
          - Cover the topic comprehensively
          - Use credible sources
        min_score: 0.80
        timeout_seconds: 120
  
  security:
    # LLM routing is handled by the orchestrator — do not add api.openai.com here.
    # The browser/search MCP tool servers make outbound requests on behalf of the agent.
    network:
      mode: "allow"
      allowlist:
        - "*.google.com"
        - "*.wikipedia.org"
        - "arxiv.org"
    
    filesystem:
      read:
        - "/data/inputs"
      write:
        - "/data/outputs"
    
    resources:
      cpu: 1000       # 1000 millicores = 1.0 CPU core
      memory: "1Gi"
      disk: "2Gi"
      timeout: "600s" # 10 minutes for research
  
  tools:
    - "mcp:browser"
    - "mcp:search"
