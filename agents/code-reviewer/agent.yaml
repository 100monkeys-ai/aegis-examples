apiVersion: 100monkeys.ai/v1
kind: Agent

metadata:
  name: "code-reviewer"
  version: "1.0.0"
  description: "AI-powered code review agent with GitHub integration"
  labels:
    role: "worker"
    category: "development"

spec:
  runtime:
    language: "python"
    version: "3.11"
    isolation: "inherit"
  
  task:
    instruction: |
      Review code changes in the pull request and provide actionable feedback.
      Your review must include:
      - Security vulnerabilities or concerns
      - Performance issues or optimizations
      - Code quality and maintainability suggestions
      - Best practices and idiomatic code recommendations
      - Positive highlights of good patterns used
      Provide specific line references and concrete improvement suggestions.
    prompt_template: |
      {{instruction}}
      
      User: {{input}}
      Reviewer:
  
  execution:
    mode: "iterative"  # Enable refinement loop
    max_iterations: 3

    validation:
      - type: semantic
        judge_agent: "code-quality-judge"
        criteria: |
          Assess if the code review meets professional standards.
          The review should:
          - Address all critical aspects (security, performance, quality)
          - Provide specific, actionable feedback
          - Include both concerns and positive observations
          - Reference specific code sections
        min_score: 0.80
        timeout_seconds: 120
  
  security:
    # LLM routing is handled by the orchestrator — do not add api.openai.com here.
    # The GitHub MCP tool server makes api.github.com calls on behalf of the agent.
    network:
      mode: "allow"
      allowlist:
        - "api.github.com"
    
    filesystem:
      read:
        - "/data/inputs"
      write:
        - "/data/outputs"
    
    resources:
      cpu: 1000       # 1000 millicores = 1.0 CPU core
      memory: "1Gi"
      disk: "2Gi"
      timeout: "300s"
  
  tools:
    - "mcp:github"
    - "mcp:filesystem"

  # Secrets referenced here are resolved by the orchestrator via OpenBao and
  # injected into the associated MCP tool server process — NOT the agent container.
  env:
    GITHUB_TOKEN: "secret:github-token"
